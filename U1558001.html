<html lang="zh-TW">
<head>

    <header class="page-header">
        <h1>精選圖片展覽館</h1>

    <main class="gallery-container">

        <a href="https://unsplash.com" target="_blank" rel="noopener noreferrer" class="image-card">

                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="雄偉山脈景觀">
            </div>
            <div class="card-info">
                <h3>雄偉山脈</h3>
                <p>點擊造訪 Unsplash</p>
            </div>
        </a>

        <!-- 圖片 2 -->
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" class="image-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="陽光沙灘景觀">
            </div>
            <div class="card-info">
                <h3>熱帶沙灘</h3>
                <p>點擊造訪 Google</p>
            </div>

            <div class="card-info">

            </div>
        </a>

        <!-- 圖片 4 -->
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="image-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?auto=format&fit=crop&w=600&q=80" alt="繁華都市夜景">

            <div class="card-info">
                <h3>璀璨都市</h3>

            </div>
            <div class="card-info">
                <h3>浩瀚星空</h3>

            </div>
